<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CAR MATCH — Tus coches recomendados</title>

    <link
        rel="icon"
        type="image/png"
        href="images/favicon.png"
    >

    <meta
        name="description"
        content="Descubre los coches que mejor encajan contigo según tus respuestas y preferencias."
    >

    <meta
        name="robots"
        content="noindex, follow"
    >

    <meta
        name="author"
        content="CAR MATCH"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1813960443566074"
     crossorigin="anonymous"></script>

</head>


<body class="results-page">


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <header class="navbar results-navbar">

        <a
            href="index.html"
            class="logo"
            aria-label="CAR MATCH - Inicio"
        >

            <img
                src="images/logo.png"
                alt="CAR MATCH"
            >

        </a>


        <nav aria-label="Navegación principal">

            <a href="index.html">
                Inicio
            </a>

            <a href="index.html#how-it-works">
                Cómo funciona
            </a>

            <a href="explore.html">
                Explorar coches
            </a>

            <a href="compare.html">
                Comparar
            </a>

        </nav>


        <button
            class="primary-button results-exit"
            type="button"
            onclick="goHome()"
        >
            SALIR
        </button>


        <!-- MOBILE -->

        <button
            class="mobile-menu-button results-menu-button"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="results-main">


        <!-- =================================================
             INTRO
        ================================================== -->

        <section class="results-intro">

            <p class="section-label">
                TU CAR MATCH
            </p>

            <h1>
                Estos coches
                <span>encajan contigo.</span>
            </h1>

            <p class="hero-description results-intro-description">
                Hemos analizado tus respuestas y comparado
                tus preferencias con nuestra base de vehículos.
            </p>

        </section>



        <!-- =================================================
             BEST MATCH
        ================================================== -->

        <section class="best-match">


            <div class="best-match-image">

                <img
                    id="bestImage"
                    src=""
                    alt="Tu coche recomendado"
                >

            </div>



            <div class="best-match-content">

                <div class="best-match-main">

                    <p class="section-label best-match-label">
                        TU MEJOR MATCH
                    </p>

                    <p
                        id="bestBrand"
                        class="best-brand"
                    ></p>

                    <h2 id="bestModel"></h2>

                    <p
                        id="bestDescription"
                        class="best-description"
                    ></p>

                    <div class="best-price">

                        <span>
                            Desde
                        </span>

                        <strong id="bestPrice"></strong>

                    </div>

                </div>



                <div class="best-match-actions">

                    <div class="best-match-score">

                        <strong id="bestMatchScore">
                            —
                        </strong>

                        <span>
                            MATCH
                        </span>

                    </div>


                    <button
                        class="primary-button"
                        id="bestViewButton"
                        type="button"
                    >
                        VER COCHE
                    </button>

                </div>

            </div>

        </section>



        <!-- =================================================
             OTHER RESULTS
        ================================================== -->

        <section class="other-results">

            <div class="results-heading">

                <p class="section-label">
                    MÁS OPCIONES
                </p>

                <h2>
                    También podrían encajar contigo.
                </h2>

            </div>


            <div
                id="results"
                class="results-results-container"
            ></div>

        </section>



        <!-- =================================================
             FINAL ACTIONS
        ================================================== -->

        <section class="results-actions">

            <button
                class="primary-button"
                type="button"
                onclick="restartQuiz()"
            >
                REPETIR TEST
            </button>


            <button
                class="secondary-button"
                type="button"
                onclick="goHome()"
            >
                VOLVER AL INICIO
            </button>

        </section>


    </main>



    <!-- =====================================================
         SCRIPTS
    ====================================================== -->

    <script src="js/cars.js"></script>

    <script src="js/results.js"></script>


</body>
</html>
